name: CI

on:
  push:
    branches: [main, develop, fix/polish]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.10"

jobs:
  syntax:
    name: Syntax smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile every Python file (no deps needed)
        run: python -m compileall -q .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
      - run: pip install ".[dev]"
      - run: black --check .
      - run: isort --check-only .
      - run: >
          flake8 --max-line-length=100
          --exclude=.git,__pycache__,build,dist
          --ignore=E402,F401,F541,W291,W293,E203,E231,E501,W503,F811,F841,E226,E741,E731,F403,F601,E201,E202,E712
      # Advisory until the typing debt (~1000 legacy findings) is paid down;
      # reports still surface here on every push.
      - name: mypy (advisory, core packages)
        continue-on-error: true
        run: mypy worm_core/ rl_engine/ core/ utils/ configs/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('pyproject.toml') }}
      - run: pip install bandit
      # -ll: only report HIGH severity issues. An offensive-security codebase
      # trips LOW/MEDIUM findings by design (subprocess, crypto primitives).
      - run: >
          bandit -ll -r worm_core/ exploits/ evasion/ c2/ post_exploit/
          scanner/ utils/ -f json -o bandit-report.json || true
      - run: bandit -ll --exit-one -r worm_core/ -q || true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
        if: always()

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - run: pip install ".[test]" pytest-timeout
      - name: Run automated test suite (no live network)
        run: >
          pytest
          tests/test_smoke.py tests/test_unit.py tests/test_academic.py
          tests/test_integration_mocked.py tests/test_dynamic_mocked.py
          tests/test_integration_e2e.py tests/test_integration.py
          tests/test_new_modules.py tests/test_persistence.py
          tests/test_c2_modules.py tests/test_cli.py
          --tb=short -v --cov=worm_core --cov=configs --cov=scanner --cov=utils
          --cov=rl_engine
          --cov-report=term --cov-report=xml --cov-fail-under=30
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
