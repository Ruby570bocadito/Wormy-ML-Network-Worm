# ─────────────────────────────────────────────────────────────────────────────
# Wormy Lab — 15 vulnerable services on an isolated 192.168.100.0/24 network
#
# SAFETY: every host-side port is bound to 127.0.0.1, so none of these weak-
# credential services are reachable from your LAN. The worm reaches targets
# through the internal Docker network (docker compose exec / test-runner),
# never through these bindings.
#
# Start:  docker compose -f docker-compose-lab.yml up -d
# Verify: docker compose -f docker-compose-lab.yml ps
# Stop:   docker compose -f docker-compose-lab.yml down
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── DATABASE SERVICES ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lab_redis
    networks:
      lab_network:
        ipv4_address: 192.168.100.10
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass "redis123" --protected-mode no
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-noauth:
    image: redis:7-alpine
    container_name: lab_redis_noauth
    networks:
      lab_network:
        ipv4_address: 192.168.100.11
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --protected-mode no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:5.7
    container_name: lab_mysql
    networks:
      lab_network:
        ipv4_address: 192.168.100.12
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "testdb"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgresql:
    image: postgres:14
    container_name: lab_postgres
    networks:
      lab_network:
        ipv4_address: 192.168.100.13
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin123"
      POSTGRES_DB: "testdb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6
    container_name: lab_mongodb
    networks:
      lab_network:
        ipv4_address: 192.168.100.14
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "admin123"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: lab_mssql
    networks:
      lab_network:
        ipv4_address: 192.168.100.15
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "SqlPassword123!"

  # ── MESSAGING ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: lab_rabbitmq
    networks:
      lab_network:
        ipv4_address: 192.168.100.20
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  # ── HTTP SERVICES (Tomcat + CI + Web Apps) ───────────────────────────────
  tomcat:
    image: tomcat:9.0
    container_name: lab_tomcat
    networks:
      lab_network:
        ipv4_address: 192.168.100.31
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TOMCAT_USERNAME: "admin"
      TOMCAT_PASSWORD: "admin"
      TOMCAT_ALLOW_REMOTE_MANAGEMENT: "yes"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: lab_jenkins
    networks:
      lab_network:
        ipv4_address: 192.168.100.32
    ports:
      - "127.0.0.1:8081:8080"

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: lab_dvwa
    networks:
      lab_network:
        ipv4_address: 192.168.100.40
    ports:
      - "127.0.0.1:8082:80"

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: lab_juice
    networks:
      lab_network:
        ipv4_address: 192.168.100.50
    ports:
      - "127.0.0.1:8083:3000"

  elasticsearch:
    image: elasticsearch:7.17.0
    container_name: lab_elasticsearch
    networks:
      lab_network:
        ipv4_address: 192.168.100.60
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

  # ── NETWORK SERVICES (FTP, SSH, Telnet, SNMP) ────────────────────────────
  ftp:
    image: stilliard/pure-ftpd:latest
    container_name: lab_ftp
    networks:
      lab_network:
        ipv4_address: 192.168.100.70
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:30000-30009:30000-30009"
    environment:
      FTP_USER_NAME: "ftpuser"
      FTP_USER_PASS: "ftpuser"
      FTP_USER_HOME: "/home/ftpuser"
      PUBLICHOST: "localhost"

  ssh:
    image: linuxserver/openssh-server:latest
    container_name: lab_ssh
    networks:
      lab_network:
        ipv4_address: 192.168.100.71
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      PUID: "1000"
      PGID: "1000"
      # REQUIRED: without PASSWORD_ACCESS=true the image only accepts pubkey
      # auth and the documented admin/password target does not exist.
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: "password"
      USER_NAME: "admin"
      SUDO_ACCESS: "true"

  telnet:
    image: alpine:latest
    container_name: lab_telnet
    networks:
      lab_network:
        ipv4_address: 192.168.100.72
    ports:
      - "127.0.0.1:8023:23"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache busybox 2>/dev/null || true
        busybox telnetd -F -p 23 -l /bin/sh

  snmp:
    image: polinux/snmpd:latest
    container_name: lab_snmp
    networks:
      lab_network:
        ipv4_address: 192.168.100.73
    ports:
      - "127.0.0.1:161:161/udp"
    environment:
      SNMP_COMMUNITY: "public"
      SNMP_LOCATION: "Wormy Lab DC"

  # ── METASPLOITABLE (multi-service legacy target) ─────────────────────────
  metasploitable:
    image: tleemcjr/metasploitable2:latest
    container_name: lab_metasploitable
    networks:
      lab_network:
        ipv4_address: 192.168.100.100
    ports:
      - "127.0.0.1:2323:23"
      - "127.0.0.1:2121:21"
      - "127.0.0.1:2223:22"
      - "127.0.0.1:8084:80"
      - "127.0.0.1:33061:3306"
      - "127.0.0.1:54321:5432"
      - "127.0.0.1:5900:5900"
      - "127.0.0.1:6667:6667"
      - "127.0.0.1:8180:8180"

networks:
  lab_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
